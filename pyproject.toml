[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-judge"
version = "0.1.0"
description = "Local-judge native v1 core: envelope boundary, model port, and type-executor interfaces."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "fastapi>=0.100", "httpx>=0.27"]
serve = ["uvicorn>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
