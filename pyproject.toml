[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-judge"
version = "0.1.0"
description = "Local-judge native v1 core: envelope boundary, model port, and type-executor interfaces."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4", "fastapi>=0.141.1,<1", "httpx>=0.27", "starlette>=1.0.1,<2", "fastmcp>=4,<5"]
serve = ["uvicorn>=0.30"]
container = ["fastapi>=0.141.1,<1", "starlette>=1.0.1,<2", "fastmcp>=4,<5", "uvicorn>=0.35"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
