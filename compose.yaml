services:
  local-judge:
    build: .
    image: local-judge:local
    command: ["http"]
    environment:
      LOCAL_JUDGE_ENDPOINT_BASE_URL: ${LOCAL_JUDGE_ENDPOINT_BASE_URL:?Copy .env.example to .env and configure it}
      LOCAL_JUDGE_MODEL_IDS: ${LOCAL_JUDGE_MODEL_IDS:?Set at least one allowed model ID}
      LOCAL_JUDGE_API_KEY: ${LOCAL_JUDGE_API_KEY:-}
      LOCAL_JUDGE_RESPONSE_FORMAT: ${LOCAL_JUDGE_RESPONSE_FORMAT:-json_schema}
      LOCAL_JUDGE_HTTP_PORT: ${LOCAL_JUDGE_HTTP_PORT:-8000}
    ports:
      - "${LOCAL_JUDGE_HTTP_PORT:-8000}:${LOCAL_JUDGE_HTTP_PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
